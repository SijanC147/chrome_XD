name: Release Build (macOS)

# Builds, signs, notarizes, and publishes ChromeXD.app whenever a new version
# is released. The app is built as a universal binary (arm64 + x86_64) with a
# deployment target of macOS 13.0, so it runs on Ventura, Sonoma, and later.
#
# Signing/notarization secrets (all optional — without them the build falls
# back to ad-hoc signing and skips notarization, so CI still succeeds):
#   MACOS_CERTIFICATE_P12      base64-encoded Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD password used when exporting the .p12
#   APPLE_TEAM_ID              10-character Apple Developer Team ID
#   NOTARY_API_KEY_P8          App Store Connect API private key (.p8 contents)
#   NOTARY_API_KEY_ID          App Store Connect API Key ID
#   NOTARY_API_ISSUER_ID       App Store Connect API Issuer ID (UUID)

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_adhoc:
        description: "Force ad-hoc signing (skip Developer ID signing and notarization)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build, sign & notarize ChromeXD
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node 24)

      - name: Derive version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG=""
          fi

          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            # CFBundleShortVersionString must be 1-3 period-separated integers
            # (e.g. 1.2 or 1.2.3). Reject tags like 'vnext' or 'v1.0-beta' so
            # we never embed a malformed version in a published artifact.
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
              echo "::error::Tag '$TAG' does not yield a valid release version ('$VERSION'). Use tags of the form v<major>[.<minor>[.<patch>]], e.g. v1.2.3."
              exit 1
            fi
            ZIP_NAME="ChromeXD-$VERSION"
          else
            # Manual (workflow_dispatch) test build from a branch.
            VERSION="0.0.0"
            ZIP_NAME="ChromeXD-$VERSION-$(git rev-parse --short HEAD)"
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "zip_name=$ZIP_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (tag: '${TAG:-none}', zip: $ZIP_NAME.zip)"

      - name: Import Developer ID certificate
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FORCE_ADHOC: ${{ inputs.force_adhoc }}
        run: |
          if [ "$FORCE_ADHOC" = "true" ]; then
            echo "::notice::force_adhoc input set — using ad-hoc signing (no notarization) for this test build."
            {
              echo "signed=false"
              echo "identity=-"
              echo "team_id="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The signing secrets form a group: all three must be present to
          # sign, and none may be present to use the documented ad-hoc
          # fallback. A partial configuration is a misconfiguration — fail
          # fast with a clear message instead of dying cryptically inside
          # 'security import' or 'xcodebuild'.
          MISSING=""
          CONFIGURED=""
          for VAR in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!VAR}" ]; then
              MISSING="$MISSING $VAR"
            else
              CONFIGURED="$CONFIGURED $VAR"
            fi
          done

          if [ -z "$CONFIGURED" ]; then
            echo "::warning::No signing secrets configured — falling back to ad-hoc signing (no notarization)."
            {
              echo "signed=false"
              echo "identity=-"
              echo "team_id="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::Incomplete signing configuration. Configured:$CONFIGURED — missing:$MISSING. Set all of MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, and APPLE_TEAM_ID (or none, for the ad-hoc fallback)."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/chromexd-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

          # Import Apple's intermediate CA certificates. Without them the
          # imported identity may fail chain validation and be hidden by
          # 'find-identity -v' even though the certificate itself is fine.
          for CA in AppleWWDRCAG3 DeveloperIDG2CA; do
            curl -fsS -o "$RUNNER_TEMP/$CA.cer" \
              "https://www.apple.com/certificateauthority/$CA.cer" \
              && security import "$RUNNER_TEMP/$CA.cer" -k "$KEYCHAIN_PATH" \
                -T /usr/bin/codesign > /dev/null \
              || echo "::warning::Could not install Apple intermediate CA $CA (continuing)."
            rm -f "$RUNNER_TEMP/$CA.cer"
          done

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            # Surface what the keychain actually contains so the failure is
            # diagnosable straight from the error annotation.
            CERT_LABELS="$(security find-certificate -a "$KEYCHAIN_PATH" \
              | awk -F'"' '/"labl"/ {print $4}' | sort -u | paste -sd ';' -)"
            ALL_IDENTITIES="$(security find-identity -p codesigning "$KEYCHAIN_PATH" \
              | sed -n 's/^ *[0-9][0-9]*) //p' | paste -sd ';' -)"
            echo "::error::No valid 'Developer ID Application' identity found. Certificates in keychain: [${CERT_LABELS:-none}]. Codesigning identities (incl. invalid): [${ALL_IDENTITIES:-none}]. If a 'Developer ID Application' entry appears with an error, the certificate chain is incomplete; if only 'Apple Development'/'Apple Distribution' appear, export the Developer ID Application certificate instead; if the list is empty, the .p12 was likely exported without its private key (export from 'My Certificates' in Keychain Access)."
            exit 1
          fi

          {
            echo "signed=true"
            echo "identity=$IDENTITY"
            echo "team_id=$APPLE_TEAM_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Imported signing identity: $IDENTITY"

      - name: Build ChromeXD.app (universal)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          # A secure timestamp is required for notarization but not supported
          # for ad-hoc signatures.
          SIGN_FLAGS: ${{ steps.signing.outputs.signed == 'true' && '--timestamp' || '' }}
        run: |
          xcodebuild \
            -project ChromeXD/ChromeXD.xcodeproj \
            -scheme ChromeXD \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="$SIGN_FLAGS" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      - name: Verify build
        run: |
          APP="build/Build/Products/Release/ChromeXD.app"
          echo "--- Architectures ---"
          lipo -archs "$APP/Contents/MacOS/ChromeXD"
          echo "--- Version info ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist"
          echo "--- Deployment target ---"
          vtool -show-build "$APP/Contents/MacOS/ChromeXD" | grep -A1 minos || true
          echo "--- Code signature ---"
          codesign --verify --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"

      - name: Package app
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/ChromeXD.app" "$ZIP_NAME.zip"

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          # Like the signing secrets, the notarization secrets form a group:
          # all three or none. Fail fast on partial configuration instead of
          # letting notarytool error out on empty credentials.
          MISSING=""
          CONFIGURED=""
          for VAR in NOTARY_API_KEY_P8 NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            if [ -z "${!VAR}" ]; then
              MISSING="$MISSING $VAR"
            else
              CONFIGURED="$CONFIGURED $VAR"
            fi
          done

          if [ -z "$CONFIGURED" ]; then
            echo "::warning::Notarization secrets not configured — the app is signed but NOT notarized."
            exit 0
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::Incomplete notarization configuration. Configured:$CONFIGURED — missing:$MISSING. Set all of NOTARY_API_KEY_P8, NOTARY_API_KEY_ID, and NOTARY_API_ISSUER_ID (or none, to skip notarization)."
            exit 1
          fi

          APP="build/Build/Products/Release/ChromeXD.app"
          KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_API_KEY_P8" > "$KEY_PATH"

          echo "Submitting $ZIP_NAME.zip for notarization..."
          SUBMIT_JSON="$(xcrun notarytool submit "$ZIP_NAME.zip" \
            --key "$KEY_PATH" \
            --key-id "$NOTARY_API_KEY_ID" \
            --issuer "$NOTARY_API_ISSUER_ID" \
            --wait --output-format json)"
          echo "$SUBMIT_JSON"

          STATUS="$(echo "$SUBMIT_JSON" | jq -r '.status')"
          SUBMISSION_ID="$(echo "$SUBMIT_JSON" | jq -r '.id')"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status '$STATUS'. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id "$NOTARY_API_KEY_ID" \
              --issuer "$NOTARY_API_ISSUER_ID" || true
            rm -f "$KEY_PATH"
            exit 1
          fi
          rm -f "$KEY_PATH"

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP"

          # Re-zip so the published archive contains the stapled app.
          rm -f "$ZIP_NAME.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP_NAME.zip"

          echo "--- Gatekeeper assessment ---"
          spctl -a -vv "$APP"

      - name: Clean up signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/chromexd-signing.keychain-db" || true

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.version.outputs.zip_name }}
          path: ${{ steps.version.outputs.zip_name }}.zip
          if-no-files-found: error

      - name: Attach to GitHub release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ${{ steps.version.outputs.zip_name }}.zip
