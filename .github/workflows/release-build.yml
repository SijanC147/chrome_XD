name: Release Build (macOS)

# Builds, signs, notarizes, and publishes ChromeXD.app. The app is built as a
# universal binary (arm64 + x86_64) with a deployment target of macOS 13.0, so
# it runs on Ventura, Sonoma, and later.
#
# Triggering:
#   - Pushing a `v*` tag is THE release path. The workflow builds, signs, and
#     notarizes the app, packages it as both a .zip and a .dmg, creates the
#     GitHub release for that tag with an auto-generated changelog (if it does
#     not already exist), and attaches both artifacts to it. A release created
#     by the workflow stays a draft until both artifacts have uploaded, so a
#     failed run never leaves a published release with missing downloads.
#     Creating a release through the GitHub UI with a new tag also pushes the
#     tag, so that flow works too: the run then finds the release already
#     present and only attaches artifacts, leaving hand-written notes intact.
#     A tag push is the *only* release trigger on purpose — reacting to both
#     `push: tags` and `release: published` would start two racing runs over
#     the same release asset with different bundle versions.
#   - workflow_dispatch runs are test builds. They never create or modify
#     releases; they only upload run artifacts. Dispatching against a tag ref
#     derives the version from the tag, and force_adhoc=true skips Developer
#     ID signing and notarization entirely.
#
# Signing/notarization secrets (all optional — without them the build falls
# back to ad-hoc signing and skips notarization, so CI still succeeds):
#   MACOS_CERTIFICATE_P12      base64-encoded Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD password used when exporting the .p12
#   APPLE_TEAM_ID              10-character Apple Developer Team ID
#   NOTARY_API_KEY_P8          App Store Connect API private key (.p8 contents)
#   NOTARY_API_KEY_ID          App Store Connect API Key ID
#   NOTARY_API_ISSUER_ID       App Store Connect API Issuer ID (UUID)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_adhoc:
        description: "Force ad-hoc signing (skip Developer ID signing and notarization)"
        type: boolean
        default: false

permissions:
  contents: write

# Serialize runs that target the same tag/ref so a duplicate event can never
# race an in-flight run over the same release asset. Queue rather than cancel:
# an in-flight notarization should be allowed to finish.
concurrency:
  group: release-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build, sign & notarize ChromeXD
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node 24)
        with:
          # Full history so the release changelog can reference earlier tags.
          fetch-depth: 0

      - name: Derive version from tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG=""
          fi

          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            # CFBundleShortVersionString must be 1-3 period-separated integers
            # (e.g. 1.2 or 1.2.3). Reject tags like 'vnext' or 'v1.0-beta' so
            # we never embed a malformed version in a published artifact.
            if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
              echo "::error::Tag '$TAG' does not yield a valid release version ('$VERSION'). Use tags of the form v<major>[.<minor>[.<patch>]], e.g. v1.2.3."
              exit 1
            fi
            BASE_NAME="ChromeXD-$VERSION"
          else
            # Manual (workflow_dispatch) test build from a branch.
            VERSION="0.0.0"
            BASE_NAME="ChromeXD-$VERSION-$(git rev-parse --short HEAD)"
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "base_name=$BASE_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (tag: '${TAG:-none}', artifacts: $BASE_NAME.zip / $BASE_NAME.dmg)"

      - name: Import Developer ID certificate
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          FORCE_ADHOC: ${{ inputs.force_adhoc }}
        run: |
          adhoc() {
            {
              echo "signed=false"
              echo "notarize=false"
              echo "identity=-"
              echo "team_id="
            } >> "$GITHUB_OUTPUT"
          }

          # Each credential set is all-or-nothing: complete means use it, empty
          # means fall back to the documented unsigned path, and partial is a
          # misconfiguration that must fail loudly rather than die cryptically
          # inside 'security import' or notarytool.
          #
          # Sets <PREFIX>_MISSING and <PREFIX>_CONFIGURED. Written for bash 3.2
          # (the macOS system bash), so no namerefs.
          check_group() {
            local prefix="$1"
            shift
            local missing="" configured="" var
            for var in "$@"; do
              if [ -z "${!var}" ]; then
                missing="$missing $var"
              else
                configured="$configured $var"
              fi
            done
            eval "${prefix}_MISSING=\$missing"
            eval "${prefix}_CONFIGURED=\$configured"
          }

          if [ "$FORCE_ADHOC" = "true" ]; then
            echo "::notice::force_adhoc input set — using ad-hoc signing (no notarization) for this test build."
            adhoc
            exit 0
          fi

          check_group SIGN \
            MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID
          check_group NOTARY \
            NOTARY_API_KEY_P8 NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID

          if [ -z "$SIGN_CONFIGURED" ]; then
            echo "::warning::No signing secrets configured — falling back to ad-hoc signing (no notarization)."
            adhoc
            exit 0
          fi

          if [ -n "$SIGN_MISSING" ]; then
            echo "::error::Incomplete signing configuration. Configured:$SIGN_CONFIGURED — missing:$SIGN_MISSING. Set all of MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, and APPLE_TEAM_ID (or none, for the ad-hoc fallback)."
            exit 1
          fi

          if [ -n "$NOTARY_CONFIGURED" ] && [ -n "$NOTARY_MISSING" ]; then
            echo "::error::Incomplete notarization configuration. Configured:$NOTARY_CONFIGURED — missing:$NOTARY_MISSING. Set all of NOTARY_API_KEY_P8, NOTARY_API_KEY_ID, and NOTARY_API_ISSUER_ID (or none, to skip notarization)."
            exit 1
          fi

          if [ -z "$NOTARY_CONFIGURED" ]; then
            echo "::warning::Notarization secrets not configured — artifacts will be signed but NOT notarized."
            NOTARIZE=false
          else
            NOTARIZE=true
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/chromexd-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

          # Import Apple's intermediate CA certificates. Without them the
          # imported identity may fail chain validation and be hidden by
          # 'find-identity -v' even though the certificate itself is fine.
          for CA in AppleWWDRCAG3 DeveloperIDG2CA; do
            curl -fsS -o "$RUNNER_TEMP/$CA.cer" \
              "https://www.apple.com/certificateauthority/$CA.cer" \
              && security import "$RUNNER_TEMP/$CA.cer" -k "$KEYCHAIN_PATH" \
                -T /usr/bin/codesign > /dev/null \
              || echo "::warning::Could not install Apple intermediate CA $CA (continuing)."
            rm -f "$RUNNER_TEMP/$CA.cer"
          done

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            # Surface what the keychain actually contains so the failure is
            # diagnosable straight from the error annotation.
            CERT_LABELS="$(security find-certificate -a "$KEYCHAIN_PATH" \
              | awk -F'"' '/"labl"/ {print $4}' | sort -u | paste -sd ';' -)"
            ALL_IDENTITIES="$(security find-identity -p codesigning "$KEYCHAIN_PATH" \
              | sed -n 's/^ *[0-9][0-9]*) //p' | paste -sd ';' -)"
            echo "::error::No valid 'Developer ID Application' identity found. Certificates in keychain: [${CERT_LABELS:-none}]. Codesigning identities (incl. invalid): [${ALL_IDENTITIES:-none}]. If a 'Developer ID Application' entry appears with an error, the certificate chain is incomplete; if only 'Apple Development'/'Apple Distribution' appear, export the Developer ID Application certificate instead; if the list is empty, the .p12 was likely exported without its private key (export from 'My Certificates' in Keychain Access)."
            exit 1
          fi

          {
            echo "signed=true"
            echo "notarize=$NOTARIZE"
            echo "identity=$IDENTITY"
            echo "team_id=$APPLE_TEAM_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Imported signing identity: $IDENTITY"

      - name: Build ChromeXD.app (universal)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          # A secure timestamp is required for notarization but not supported
          # for ad-hoc signatures.
          SIGN_FLAGS: ${{ steps.signing.outputs.signed == 'true' && '--timestamp' || '' }}
        run: |
          xcodebuild \
            -project ChromeXD/ChromeXD.xcodeproj \
            -scheme ChromeXD \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="$SIGN_FLAGS" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      - name: Verify build
        run: |
          APP="build/Build/Products/Release/ChromeXD.app"
          echo "--- Architectures ---"
          lipo -archs "$APP/Contents/MacOS/ChromeXD"
          echo "--- Version info ---"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist"
          echo "--- Deployment target ---"
          vtool -show-build "$APP/Contents/MacOS/ChromeXD" | grep -A1 minos || true
          echo "--- Code signature ---"
          codesign --verify --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"

      - name: Package app archive
        env:
          BASE_NAME: ${{ steps.version.outputs.base_name }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release/ChromeXD.app" "$BASE_NAME.zip"

      - name: Notarize and staple app
        if: steps.signing.outputs.notarize == 'true'
        env:
          BASE_NAME: ${{ steps.version.outputs.base_name }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          APP="build/Build/Products/Release/ChromeXD.app"
          # The ticket attaches to the .app, so submit the zip but staple the
          # bundle, then re-zip so the published archive carries the ticket.
          .github/scripts/notarize.sh --submit "$BASE_NAME.zip" --staple "$APP"
          rm -f "$BASE_NAME.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$BASE_NAME.zip"

          echo "--- Gatekeeper assessment (app) ---"
          spctl -a -vv "$APP"

      - name: Build disk image
        env:
          BASE_NAME: ${{ steps.version.outputs.base_name }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          # Packages the already-signed (and, for release builds, stapled) app.
          .github/scripts/make-dmg.sh \
            --app "build/Build/Products/Release/ChromeXD.app" \
            --output "$BASE_NAME.dmg" \
            --volname "ChromeXD $VERSION" \
            --sign "$SIGN_IDENTITY"

      - name: Notarize and staple disk image
        if: steps.signing.outputs.notarize == 'true'
        env:
          BASE_NAME: ${{ steps.version.outputs.base_name }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          # A disk image is notarized and stapled in place.
          .github/scripts/notarize.sh --submit "$BASE_NAME.dmg"

          echo "--- Gatekeeper assessment (disk image) ---"
          spctl -a -t open --context context:primary-signature -vv "$BASE_NAME.dmg"

      - name: Clean up signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/chromexd-signing.keychain-db" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.version.outputs.base_name }}
          path: |
            ${{ steps.version.outputs.base_name }}.zip
            ${{ steps.version.outputs.base_name }}.dmg
          if-no-files-found: error

      # Publishing is restricted to tag pushes. workflow_dispatch runs must
      # never mutate releases, even when they target a tag ref, so a manual
      # (possibly ad-hoc signed) test build can never overwrite an official
      # release asset.
      #
      # The script creates its release as a draft and publishes it only after
      # every asset has uploaded, so a failed or interrupted run cannot leave
      # a visible release with missing downloads.
      - name: Publish release with artifacts
        if: github.event_name == 'push' && steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_NAME: ${{ steps.version.outputs.base_name }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          .github/scripts/publish-release.sh \
            --tag "$TAG" \
            --version "$VERSION" \
            --asset "$BASE_NAME.zip" \
            --asset "$BASE_NAME.dmg"
